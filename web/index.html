<!doctype html>
<html lang="pt-BR" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <title>mobphone</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Tema aplicado antes da pintura para evitar flash (claro/escuro). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pindurados.theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = saved ? saved === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
