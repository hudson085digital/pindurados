# Deploy da API (Fastify) no Render — FREE (sem disco).
# Os comprovantes vão para o Supabase Storage, então não é preciso disco persistente.
# Importe o repositório no Render (New > Blueprint) e preencha as envs sync:false.
services:
  - type: web
    name: pindurados-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: pnpm install && pnpm prisma:generate && pnpm build
    preDeployCommand: pnpm exec prisma migrate deploy
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Supabase — pooler 6543, ?pgbouncer=true (senha URL-encoded)
      - key: DIRECT_URL
        sync: false # Supabase — session/direct 5432
      - key: SUPABASE_URL
        sync: false # https://<ref>.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Settings > API > service_role (secreto)
      - key: SUPABASE_BUCKET
        value: comprovantes
